<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="noteSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="frontPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="foldFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1D4ED8" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Back Document Pages (Layered Stack, Transparent Background) -->
  <rect x="135" y="60" width="260" height="350" rx="26" fill="#94A3B8" opacity="0.35" transform="rotate(7 265 235)"/>
  <rect x="115" y="65" width="260" height="350" rx="26" fill="#64748B" opacity="0.6" transform="rotate(3.5 245 240)"/>

  <!-- Main Front Page with Drop Shadow -->
  <g filter="url(#docShadow)">
    <path d="M 90 70 
             C 90 55.64 101.64 44 116 44 
             L 270 44 
             L 370 144 
             L 370 416 
             C 370 430.36 358.36 442 344 442 
             L 116 442 
             C 101.64 442 90 430.36 90 416 
             Z" 
          fill="url(#frontPage)" 
          stroke="#E2E8F0" 
          stroke-width="2"/>
    
    <!-- Folded Corner Flap -->
    <path d="M 270 44 L 270 120 C 270 133.25 280.75 144 294 144 L 370 144 Z" 
          fill="url(#foldFlap)"/>
  </g>

  <!-- Left Spine Accent -->
  <path d="M 90 70 C 90 55.64 101.64 44 116 44 L 132 44 L 132 442 L 116 442 C 101.64 442 90 430.36 90 416 Z" fill="url(#noteSpine)"/>

  <!-- Content Note Lines -->
  <rect x="165" y="195" width="160" height="18" rx="9" fill="#64748B"/>
  <rect x="165" y="240" width="160" height="18" rx="9" fill="#94A3B8"/>
  <rect x="165" y="285" width="115" height="18" rx="9" fill="#CBD5E1"/>

  <!-- Modern Checkmark Seal on Bottom Right -->
  <g transform="translate(275, 330)" filter="url(#badgeShadow)">
    <circle cx="55" cy="55" r="50" fill="url(#noteSpine)"/>
    <circle cx="55" cy="55" r="47" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <path d="M 38 56 L 50 68 L 74 44" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
