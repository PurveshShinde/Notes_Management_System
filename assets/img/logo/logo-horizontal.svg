<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="hzAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="hzPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="hzTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="hzShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #0F172A;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #2563EB;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #64748B;
    }
    @media (prefers-color-scheme: dark) {
      .title-text { fill: #F8FAFC; }
      .subtitle-text { fill: #94A3B8; }
    }
  </style>

  <!-- Left Icon Mark -->
  <g transform="translate(30, 20)">
    <!-- Back Stack -->
    <rect x="42" y="10" width="76" height="106" rx="8" fill="#94A3B8" opacity="0.4" transform="rotate(6 80 63)"/>
    <rect x="36" y="12" width="76" height="106" rx="8" fill="#64748B" opacity="0.6" transform="rotate(3 74 65)"/>
    
    <!-- Front Page with Fold -->
    <g filter="url(#hzShadow)">
      <path d="M 30 14 C 30 9.58 33.58 6 38 6 L 86 6 L 118 38 L 118 126 C 118 130.42 114.42 134 110 134 L 38 134 C 33.58 134 30 130.42 30 126 Z" fill="url(#hzPage)"/>
      <path d="M 86 6 L 86 28 C 86 33.52 90.48 38 96 38 L 118 38 Z" fill="#CBD5E1"/>
    </g>

    <!-- Spine Accent -->
    <path d="M 30 14 C 30 9.58 33.58 6 38 6 L 44 6 L 44 134 L 38 134 C 33.58 134 30 130.42 30 126 Z" fill="url(#hzAccent)"/>

    <!-- Content Lines -->
    <rect x="54" y="52" width="50" height="6" rx="3" fill="#64748B"/>
    <rect x="54" y="66" width="50" height="6" rx="3" fill="#94A3B8"/>
    <rect x="54" y="80" width="34" height="6" rx="3" fill="#CBD5E1"/>

    <!-- Seal -->
    <g transform="translate(86, 92)" filter="url(#hzShadow)">
      <circle cx="20" cy="20" r="18" fill="url(#hzAccent)"/>
      <path d="M 14 20 L 18 24 L 26 16" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Typography Content -->
  <g transform="translate(200, 48)">
    <rect x="0" y="0" width="186" height="24" rx="12" fill="#EFF6FF"/>
    <text x="14" y="16" class="badge-text">SECURE &amp; VERIFIED</text>
    
    <text x="0" y="64" class="title-text">Notes Management System</text>
    <text x="0" y="94" class="subtitle-text">Centralized educational note sharing, document storage, and revision tracking</text>
  </g>
</svg>

