    <path d="M 6 4 C 6 2.5 7.2 1 9 1 L 28 1 L 38 11 L 38 43 C 38 44.5 36.8 46 35 46 L 9 46 C 7.2 46 6 44.5 6 43 Z" fill="#FFFFFF"/>
    <!-- Folded Flap -->
    <path d="M 28 1 L 28 10 C 28 11 29 11 30 11 L 38 11 Z" fill="#CBD5E1"/>
    <!-- Spine -->
    <path d="M 6 4 C 6 2.5 7.2 1 9 1 L 11 1 L 11 46 L 9 46 C 7.2 46 6 44.5 6 43 Z" fill="url(#whiteLogoGrad)"/>
    <!-- Text Lines -->
    <rect x="15" y="16" width="16" height="3" rx="1.5" fill="#64748B"/>
    <rect x="15" y="22" width="16" height="3" rx="1.5" fill="#94A3B8"/>
    <rect x="15" y="28" width="10" height="3" rx="1.5" fill="#CBD5E1"/>
    <!-- Badge Dot -->
    <circle cx="34" cy="36" r="6" fill="url(#whiteLogoGrad)"/>
    <path d="M 31 36 L 33 38 L 37 34" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="56" y="28" class="brand-title">NotesSystem</text>
  <text x="56" y="44" class="brand-sub">Management Platform</text>
